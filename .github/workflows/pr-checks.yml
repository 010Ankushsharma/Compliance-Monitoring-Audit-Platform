# =============================================================
#  PR Checks — fast feedback on every pull request
#  File: .github/workflows/pr-checks.yml
#
#  Runs on: every PR targeting main or develop
#  Goal: complete in < 5 minutes for tight feedback loops
# =============================================================

name: PR Checks

on:
  pull_request:
    branches: [main, develop]
    types:    [opened, synchronize, reopened, ready_for_review]

# Cancel superseded runs on the same PR
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────────
  # Skip drafts — wait until the PR is marked ready for review
  # ─────────────────────────────────────────────────────────────
  draft-check:
    name: Skip Draft PRs
    runs-on: ubuntu-22.04
    if: github.event.pull_request.draft == false
    steps:
      - run: echo "PR is ready for review — proceeding"

  # ─────────────────────────────────────────────────────────────
  # Lint commit messages (Conventional Commits)
  # ─────────────────────────────────────────────────────────────
  commit-lint:
    name: Lint Commit Messages
    runs-on: ubuntu-22.04
    needs: draft-check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v5
        with:
          configFile: .commitlintrc.json

  # ─────────────────────────────────────────────────────────────
  # Code style + compile check
  # ─────────────────────────────────────────────────────────────
  style-compile:
    name: Style & Compile
    runs-on: ubuntu-22.04
    needs: draft-check
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache:        maven

      - name: Check Spotless (Google Java Format)
        run: ./mvnw spotless:check -B --no-transfer-progress

      - name: Compile (catch syntax errors fast)
        run: ./mvnw compile -B --no-transfer-progress -q

  # ─────────────────────────────────────────────────────────────
  # Fast unit tests (no containers)
  # ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    needs: style-compile
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache:        maven

      - name: Run unit tests
        run: ./mvnw test -B --no-transfer-progress
        env:
          JWT_SECRET: "pr-check-secret-key-minimum-256-bits-long-for-testing-only"

      - name: Comment coverage on PR
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths:          ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token:          ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall:   80
          min-coverage-changed-files: 70
          title:          "Code Coverage Report"
          update-comment: true

  # ─────────────────────────────────────────────────────────────
  # Security — quick scan on changed dependencies
  # ─────────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-22.04
    needs: draft-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses:    GPL-2.0, GPL-3.0, AGPL-3.0

  # ─────────────────────────────────────────────────────────────
  # PR size check — keep PRs reviewable
  # ─────────────────────────────────────────────────────────────
  pr-size:
    name: PR Size Check
    runs-on: ubuntu-22.04
    needs: draft-check
    steps:
      - uses: actions/checkout@v4
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const total = additions + deletions;

            let label = 'size/XS';
            if      (total > 1000) label = 'size/XL';
            else if (total > 500)  label = 'size/L';
            else if (total > 200)  label = 'size/M';
            else if (total > 50)   label = 'size/S';

            await github.rest.issues.addLabels({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              issue_number: pr.number,
              labels:      [label]
            });

            if (total > 1000) {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: pr.number,
                body: `⚠️ This PR is very large (${total} lines changed). Consider breaking it into smaller PRs for easier review.`
              });
            }
