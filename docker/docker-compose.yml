# =============================================================
#  docker-compose.yml — Full local development stack
#  File: docker-compose.yml
#
#  Services:
#    - compliance-app    (Spring Boot API)
#    - postgres          (Primary datastore)
#    - redis             (Cache & rate-limit buckets)
#    - zookeeper         (Kafka coordination)
#    - kafka             (Event streaming)
#    - kafka-ui          (Provectus Kafka browser)
#    - mailhog           (Local SMTP server)
#    - prometheus        (Metrics scraping)
#    - grafana           (Metrics dashboards)
#
#  Usage:
#    cp .env.example .env          # fill in JWT_SECRET at minimum
#    docker-compose up -d          # start all services
#    docker-compose logs -f app    # follow app logs
#    docker-compose down -v        # stop and remove volumes
# =============================================================

services:

  # ── PostgreSQL 15 ──────────────────────────────────────────
  postgres:
    image: postgres:${POSTGRES_VERSION:-15-alpine}
    container_name: compliance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-compliance_db}
      POSTGRES_USER:     ${DB_USERNAME:-compliance_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-compliance_pass}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-compliance_user} -d ${DB_NAME:-compliance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - compliance-net

  # ── Redis 7 ────────────────────────────────────────────────
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: compliance-redis
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 60 1
        --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compliance-net

  # ── Zookeeper ──────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:${ZOOKEEPER_VERSION:-7.5.0}
    container_name: compliance-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compliance-net

  # ── Apache Kafka ───────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:${KAFKA_VERSION:-7.5.0}
    container_name: compliance-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID:                    1
      KAFKA_ZOOKEEPER_CONNECT:            zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS:         PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:   PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:    "true"
      KAFKA_NUM_PARTITIONS:               3
      KAFKA_DEFAULT_REPLICATION_FACTOR:   1
      KAFKA_LOG_RETENTION_HOURS:          168        # 7 days
      KAFKA_LOG_SEGMENT_BYTES:            1073741824 # 1GB
      KAFKA_LOG4J_LOGGERS:                "kafka=WARN,kafka.controller=WARN,kafka.log.LogCleaner=WARN,state.change.logger=WARN,kafka.producer.async.DefaultEventHandler=WARN"
      TZ: UTC
    ports:
      - "29092:29092"    # external access (host)
      - "9092:9092"      # internal (container-to-container)
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - compliance-net

  # ── Kafka UI (Provectus) ───────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION:-latest}
    container_name: compliance-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME:               local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS:   kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER:          zookeeper:2181
      DYNAMIC_CONFIG_ENABLED:              "true"
      AUTH_TYPE:                           DISABLED   # Enable LOGIN_FORM in staging
    ports:
      - "8090:8080"
    networks:
      - compliance-net
    profiles:
      - tools   # start with: docker-compose --profile tools up -d

  # ── MailHog (local SMTP) ───────────────────────────────────
  mailhog:
    image: mailhog/mailhog:${MAILHOG_VERSION:-latest}
    container_name: compliance-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - compliance-net
    profiles:
      - tools

  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.52.0}
    container_name: compliance-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - compliance-net
    profiles:
      - monitoring

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-10.4.2}
    container_name: compliance-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_INSTALL_PLUGINS:         grafana-clock-panel
      GF_SERVER_ROOT_URL:         http://localhost:3001
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - compliance-net
    profiles:
      - monitoring

  # ── Compliance App ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: compliance-audit-platform:${APP_IMAGE_TAG:-local}
    container_name: compliance-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE:  dev
      DB_HOST:                 postgres
      DB_PORT:                 5432
      DB_NAME:                 ${DB_NAME:-compliance_db}
      DB_USERNAME:             ${DB_USERNAME:-compliance_user}
      DB_PASSWORD:             ${DB_PASSWORD:-compliance_pass}
      REDIS_HOST:              redis
      REDIS_PORT:              6379
      REDIS_PASSWORD:          ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET:              ${JWT_SECRET}          # REQUIRED — must be set in .env
      JWT_EXPIRATION_MS:       ${JWT_EXPIRATION_MS:-3600000}
      SMTP_HOST:               mailhog
      SMTP_PORT:               1025
      EMAIL_NOTIFICATIONS_ENABLED: "false"
      REPORTS_STORAGE_PATH:    /data/compliance-reports
      LOG_LEVEL:               ${LOG_LEVEL:-INFO}
      SERVER_PORT:             8080
      MANAGEMENT_PORT:         8081
    ports:
      - "${SERVER_PORT:-8080}:8080"      # API
      - "${MANAGEMENT_PORT:-8081}:8081"  # Actuator
    volumes:
      - reports_data:/data/compliance-reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - compliance-net

# ── Volumes ────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  reports_data:
    driver: local

# ── Networks ───────────────────────────────────────────────────
networks:
  compliance-net:
    driver: bridge
    name: compliance-network

# =============================================================
# Usage examples:
#
#  Start core services only (app + infra):
#    docker-compose up -d
#
#  Start with dev tools (Kafka UI, MailHog):
#    docker-compose --profile tools up -d
#
#  Start with monitoring (Prometheus + Grafana):
#    docker-compose --profile monitoring up -d
#
#  Start everything:
#    docker-compose --profile tools --profile monitoring up -d
#
#  View live logs:
#    docker-compose logs -f app
#
#  Run only infra (for local IDE dev):
#    docker-compose up -d postgres redis kafka
#
#  Rebuild app image after code changes:
#    docker-compose up -d --build app
#
#  Reset everything:
#    docker-compose down -v
# =============================================================
