# =============================================================
#  HorizontalPodAutoscaler — auto-scale based on CPU + RPS
#  File: k8s/hpa.yaml
#
#  Requires: metrics-server installed in the cluster
#  For RPS-based scaling: KEDA or custom metrics adapter
# =============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name:      compliance-hpa
  namespace: compliance
  labels:
    app.kubernetes.io/name:      compliance-audit-platform
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       compliance-app

  minReplicas: 3     # minimum 3 for HA across 3 AZs
  maxReplicas: 10    # maximum 10 — adjust for capacity

  metrics:
    # ── CPU-based scaling ────────────────────────────────────
    - type: Resource
      resource:
        name: cpu
        target:
          type:               Utilization
          averageUtilization: 65   # scale up when avg CPU > 65%

    # ── Memory-based scaling ──────────────────────────────────
    - type: Resource
      resource:
        name: memory
        target:
          type:               Utilization
          averageUtilization: 75   # scale up when avg memory > 75%

  behavior:
    # Scale up quickly on traffic spike
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type:          Pods
          value:         3        # add up to 3 pods at once
          periodSeconds: 60
        - type:          Percent
          value:         50       # or 50% of current replicas
          periodSeconds: 60
      selectPolicy: Max          # use whichever adds more pods

    # Scale down slowly to prevent thrashing
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 min before scaling down
      policies:
        - type:          Pods
          value:         1        # remove 1 pod at a time
          periodSeconds: 120
