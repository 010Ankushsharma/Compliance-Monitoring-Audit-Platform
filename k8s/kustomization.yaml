# =============================================================
#  Kustomization — single apply for the entire stack
#  File: k8s/kustomization.yaml
#
#  Apply all manifests:
#    kubectl apply -k k8s/
#
#  Dry-run:
#    kubectl apply -k k8s/ --dry-run=client
#
#  Diff (requires kubectl-diff plugin):
#    kubectl diff -k k8s/
# =============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: compliance

resources:
  - namespace.yaml
  - rbac.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policy.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of:    compliance-audit-platform

images:
  - name:    compliance-audit-platform
    newTag:  "1.0.0"    # bump this on every release
