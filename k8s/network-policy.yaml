# =============================================================
#  NetworkPolicy — restrict pod-to-pod traffic
#  File: k8s/network-policy.yaml
#
#  Default-deny all ingress/egress, then allow only:
#    - Ingress from NGINX Ingress controller
#    - Egress to PostgreSQL, Redis, Kafka
#    - Egress to SMTP relay
#    - Egress to DNS (kube-dns)
#    - Ingress from Prometheus scraper
# =============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name:      compliance-network-policy
  namespace: compliance
  labels:
    app.kubernetes.io/name:      compliance-audit-platform
    app.kubernetes.io/component: network
spec:
  podSelector:
    matchLabels:
      app: compliance-app

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # ── Allow traffic from NGINX Ingress controller ───────────
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP

    # ── Allow Prometheus scraping ────────────────────────────
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 8081
          protocol: TCP

  egress:
    # ── PostgreSQL ────────────────────────────────────────────
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP

    # ── Redis ─────────────────────────────────────────────────
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP

    # ── Kafka ─────────────────────────────────────────────────
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092
          protocol: TCP

    # ── SMTP relay ────────────────────────────────────────────
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0    # Replace with SMTP relay IP/CIDR
      ports:
        - port: 587
          protocol: TCP

    # ── Slack API / external webhooks (HTTPS) ────────────────
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP

    # ── DNS (kube-dns) ────────────────────────────────────────
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
