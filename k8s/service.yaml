# =============================================================
#  Service — exposes the API and management ports
#  File: k8s/service.yaml
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name:      compliance-service
  namespace: compliance
  labels:
    app.kubernetes.io/name:      compliance-audit-platform
    app.kubernetes.io/component: api
  annotations:
    # AWS NLB or ALB annotations can go here for cloud deployments
    prometheus.io/scrape: "true"
    prometheus.io/port:   "8081"
spec:
  type:     ClusterIP        # Ingress handles external exposure
  selector:
    app: compliance-app
  ports:
    - name:       http
      port:       80
      targetPort: 8080
      protocol:   TCP
    - name:       management
      port:       8081
      targetPort: 8081
      protocol:   TCP
  sessionAffinity: None

---
# ── Headless service for Prometheus pod-level scraping ────────
apiVersion: v1
kind: Service
metadata:
  name:      compliance-headless
  namespace: compliance
  labels:
    app.kubernetes.io/name:      compliance-audit-platform
    app.kubernetes.io/component: metrics
spec:
  clusterIP: None
  selector:
    app: compliance-app
  ports:
    - name:       management
      port:       8081
      targetPort: 8081
