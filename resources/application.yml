# =============================================================
#  Compliance Monitoring & Audit Platform
#  application.yml — Base configuration (shared across all profiles)
#  Profile-specific overrides live in application-dev.yml / application-prod.yml
# =============================================================

spring:

  application:
    name: compliance-audit-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── Jackson ─────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  # ── JPA / Hibernate ─────────────────────────────────────────
  jpa:
    open-in-view: false                         # never hold DB connection during view rendering
    hibernate:
      ddl-auto: validate                        # Flyway owns schema; Hibernate only validates
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
        generate_statistics: false
        cache:
          use_second_level_cache: false         # Redis handles app-level caching instead

  # ── Flyway ──────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history

  # ── Cache (Redis) ────────────────────────────────────────────
  cache:
    type: redis
    redis:
      time-to-live: 600000                      # 10 minutes default TTL (ms)
      cache-null-values: false
      key-prefix: "compliance:"
      use-key-prefix: true

  # ── Kafka ────────────────────────────────────────────────────
  kafka:
    consumer:
      group-id: compliance-platform
      auto-offset-reset: earliest
      enable-auto-commit: false                 # manual ack for guaranteed delivery
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.company.compliance.*"
        spring.json.use.type.headers: false
        isolation.level: read_committed
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                                 # strongest durability guarantee
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        transactional.id: compliance-tx
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3

  # ── Async ─────────────────────────────────────────────────────
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 500
        keep-alive: 60s
      thread-name-prefix: "compliance-async-"
    scheduling:
      pool:
        size: 4
      thread-name-prefix: "compliance-scheduler-"

  # ── Mail ──────────────────────────────────────────────────────
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ── MVC ───────────────────────────────────────────────────────
  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false                       # disable static resource mapping (API-only)

# ── Server ────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain
    min-response-size: 1024
  http2:
    enabled: true
  error:
    include-message: never                      # never expose stack traces in responses
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  shutdown: graceful                            # wait for in-flight requests to complete

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

# ── Actuator ──────────────────────────────────────────────────
management:
  server:
    port: ${MANAGEMENT_PORT:8081}              # separate port — not exposed publicly
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus,metrics,loggers,flyway,caches
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true                          # /actuator/health/liveness + /readiness
    prometheus:
      enabled: true
    loggers:
      enabled: true
  health:
    redis:
      enabled: true
    kafka:
      enabled: true
    db:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
  tracing:
    sampling:
      probability: 0.1                         # sample 10% of traces in base; overridden per profile

# ── SpringDoc / Swagger UI ────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  info:
    title: "Compliance Monitoring & Audit Platform API"
    version: "1.0.0"
    description: >
      REST API for compliance policy management, real-time monitoring,
      immutable audit trail, violation detection, and regulatory reporting.
    contact:
      name: "Platform Team"
      email: "platform@company.com"
    license:
      name: "MIT"
      url: "https://opensource.org/licenses/MIT"
  components:
    security-schemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT

# ── Application-specific properties ──────────────────────────
app:

  # JWT
  jwt:
    secret: ${JWT_SECRET}                      # min 256-bit random key; REQUIRED
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}           # 1 hour
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days
    issuer: "compliance-audit-platform"

  # Audit Trail
  audit:
    retention-days: ${AUDIT_RETENTION_DAYS:365}
    hash-algorithm: SHA-256
    chain-verification-enabled: true
    async-enabled: true                        # publish to Kafka; do not block request thread

  # Rate Limiting
  rate-limit:
    enabled: true
    requests-per-minute: ${RATE_LIMIT_RPM:60}
    burst-capacity: ${RATE_LIMIT_BURST:20}

  # Kafka Topics (single source of truth for topic names)
  kafka:
    topics:
      audit-events: compliance.audit-events
      violations: compliance.violations
      alerts: compliance.alerts
      report-requests: compliance.report-requests
    partitions: 3
    replication-factor: 1                      # overridden to 3 in prod profile

  # Notifications
  notifications:
    email:
      from: ${NOTIFICATION_FROM_EMAIL:noreply@company.com}
      from-name: "Compliance Platform"
      enabled: ${EMAIL_NOTIFICATIONS_ENABLED:false}
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
      enabled: ${SLACK_NOTIFICATIONS_ENABLED:false}
      channel: "#compliance-alerts"
    webhook:
      timeout-seconds: 10
      retry-attempts: 3

  # Report Generation
  reports:
    storage-path: ${REPORTS_STORAGE_PATH:/tmp/compliance-reports}
    async-generation: true
    max-concurrent-jobs: 5
    cleanup-days: 90                           # delete reports older than 90 days

  # CORS — tightened per profile
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  # IP Allowlist (empty = disabled)
  security:
    ip-allowlist-enabled: ${IP_ALLOWLIST_ENABLED:false}
    allowed-ips: ${ALLOWED_IPS:}

# ── Logging base (format overridden per profile) ──────────────
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.company.compliance: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
