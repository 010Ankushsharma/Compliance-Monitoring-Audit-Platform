# =============================================================
#  application-dev.yml — Development profile overrides
#  Start with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# =============================================================

spring:

  # ── DataSource ─────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:compliance_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      pool-name: HikariPool-Dev
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1

  # ── JPA ────────────────────────────────────────────────────
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  # ── Redis ──────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 1000ms

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        transactional.id:                       # disable transactions in dev for simplicity

  # ── Mail (MailHog in dev) ───────────────────────────────────
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

# ── Server ──────────────────────────────────────────────────
server:
  error:
    include-message: always                    # show error messages in dev
    include-stacktrace: on_param               # ?trace=true shows stacktrace
    include-exception: true

# ── Actuator — expose everything in dev ─────────────────────
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0                         # trace every request in dev

# ── Application overrides ────────────────────────────────────
app:

  jwt:
    secret: "dev-secret-key-minimum-256-bits-long-do-not-use-in-production-ever"
    expiration-ms: 86400000                    # 24 hours — convenient for dev
    refresh-expiration-ms: 2592000000          # 30 days

  audit:
    retention-days: 30                         # shorter retention in dev
    async-enabled: false                       # synchronous in dev — easier to debug

  rate-limit:
    enabled: false                             # disabled in dev

  notifications:
    email:
      enabled: true
      from: dev-noreply@localhost
    slack:
      enabled: false

  kafka:
    replication-factor: 1

  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173"

  reports:
    storage-path: /tmp/compliance-reports-dev

# ── Logging — verbose in dev ─────────────────────────────────
logging:
  level:
    root: INFO
    com.company.compliance: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.kafka: INFO
    org.flywaydb: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %highlight(%-5level) [%cyan(%thread)] [%yellow(%X{traceId})] %green(%logger{30}) - %msg%n"
